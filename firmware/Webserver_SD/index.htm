<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Switch</title>
<style>
	body { margin: 0; padding: 16px; background: #f3efe6; color: #1f2d36;
	       font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	h1 { font-size: 1.3rem; margin: 0 0 4px; }
	.hint { margin: 0 0 12px; font-size: .85rem; color: #5d6a73; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 420px; }
	.card { padding: 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px #0002; }
	.card h2 { font-size: 1rem; margin: 0 0 10px; }
	a { display: inline-block; padding: 8px 14px; border-radius: 6px; background: #17695a;
	    color: #fff; text-decoration: none; }
	a.dk { background: #5d6a73; }
	p.foot { margin: 16px 0 0; }
</style>
</head>
<body>
<h1>Light Switch</h1>
<p class="hint">Served from the SD card. The page does not show the current state.</p>
<div class="grid">
	<div class="card">
		<h2>Output 2</h2>
		<a href="/?2=on">on</a> <a class="dk" href="/?2=off">off</a>
	</div>
	<div class="card">
		<h2>Output 3</h2>
		<a href="/?3=on">on</a> <a class="dk" href="/?3=off">off</a>
	</div>
</div>
<p class="foot"><a class="dk" href="/?all=0">everything dark</a></p>
</body>
</html>
